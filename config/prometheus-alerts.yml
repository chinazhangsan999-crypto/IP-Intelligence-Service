groups:
  - name: ip-intelligence-service
    rules:
      - alert: IpIntelligenceServiceDown
        expr: up{job="ip-intelligence-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: IP intelligence service is unreachable

      - alert: IpIntelligenceRequiredSourceUnavailable
        expr: ip_intelligence_data_source_ready{required="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: A required IP database is unavailable

      - alert: IpIntelligenceDataSourceStale
        expr: ip_intelligence_data_source_stale == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: An IP intelligence data source is stale

      - alert: IpIntelligenceHighErrorRate
        expr: |
          sum by (instance) (rate(ip_intelligence_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum by (instance) (rate(ip_intelligence_http_requests_total[5m])), 0.000001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP 5xx rate is above 5 percent

      - alert: IpIntelligenceHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (instance, le) (rate(ip_intelligence_http_request_duration_seconds_bucket[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency is above 500 ms

      - alert: IpIntelligenceDataUpdateFailed
        expr: increase(ip_intelligence_data_update_runs_total{status="failed"}[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: An automatic IP data update failed

      - alert: IpIntelligencePostgresWaiting
        expr: ip_intelligence_postgres_waiting_requests > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL pool has waiting requests
